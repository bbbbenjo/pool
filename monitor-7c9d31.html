<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pool Action Monitor</title>
<style>
:root{
  --navy:#0c2038; --page:#eef3f7; --paper:#fff; --ink:#18283a;
  --muted:#657487; --line:#dfe6ed; --green:#177245; --red:#a53c3c;
}
*{box-sizing:border-box}
body{
  margin:0;padding:18px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--page);color:var(--ink)
}
main{max-width:920px;margin:auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.value{font-size:17px;font-weight:850;margin-top:4px}
.value.ok{color:var(--green)} .value.error{color:var(--red)}
.message{font-size:13px;line-height:1.4;margin-top:7px;color:#405166}
h2{font-size:15px;margin:18px 0 8px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line)}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#f8fafc}
tr:last-child td{border-bottom:0}
.type{font-weight:850}
.type.final{color:var(--green)} .type.error{color:var(--red)}
.empty{padding:18px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}

.game-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.game-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 10px;
}
.game-main{min-width:0}
.game-matchup{font-size:13px;font-weight:850}
.game-time{font-size:11px;color:var(--muted);margin-top:2px}
.game-result{font-size:11px;color:#425267;margin-top:3px;font-weight:700}
.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:76px;
  padding:5px 8px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.03em;
  text-transform:uppercase;
  white-space:nowrap;
}
.status-pill.pre{
  background:#eef2f6;
  color:#536274;
}
.status-pill.live{
  background:#fff4cf;
  color:#7a5b00;
}
.status-pill.final{
  background:#e6f3eb;
  color:#176b3b;
}

@media(max-width:620px){body{padding:10px}.grid{grid-template-columns:1fr}.value{font-size:15px}th,td{font-size:11px;padding:7px 6px}}
</style>
</head>
<body>
<main>
  <h1>Pool Action Monitor</h1>
  <div class="sub" id="weekLabel">NFL result updater</div>

  <div class="grid">
    <div class="card">
      <div class="label">Status</div>
      <div class="value" id="statusValue">—</div>
      <div class="message" id="statusMessage"></div>
    </div>
    <div class="card">
      <div class="label">Last API check</div>
      <div class="value" id="lastCheck">—</div>
    </div>
    <div class="card">
      <div class="label">Last successful API contact</div>
      <div class="value" id="lastSuccess">—</div>
    </div>
    <div class="card">
      <div class="label">Next eligible result check</div>
      <div class="value" id="nextCheck">—</div>
      <div class="message" id="nextReason"></div>
    </div>
  </div>

  <h2>Week games</h2>
  <div id="games"></div>

  <h2>Recent activity</h2>
  <div id="history"></div>
</main>

<script src="games-data.js"></script>
<script src="action-status.js"></script>
<script>
const s=(typeof ACTION_STATUS!=="undefined" && ACTION_STATUS) ? ACTION_STATUS : {};
function dt(v){
  if(!v) return "—";
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return v;
  return new Intl.DateTimeFormat(undefined,{
    weekday:"short",month:"short",day:"numeric",
    hour:"numeric",minute:"2-digit",second:"2-digit"
  }).format(d);
}
document.getElementById("weekLabel").textContent =
  s.week ? `NFL result updater • ${s.season||""} Week ${s.week}` : "NFL result updater";
const statusEl=document.getElementById("statusValue");
statusEl.textContent=(s.status||"unknown").replaceAll("-"," ");
statusEl.className="value "+(s.status==="error"?"error":"ok");
document.getElementById("statusMessage").textContent =
  s.lastError || (s.status==="not-run" ? "The updater has not run yet." : "Updater status file loaded normally.");
document.getElementById("lastCheck").textContent=dt(s.lastApiCheck);
document.getElementById("lastSuccess").textContent=dt(s.lastApiSuccess);
document.getElementById("nextCheck").textContent=dt(s.nextEligibleCheck);
document.getElementById("nextReason").textContent=s.nextCheckReason||"";


const gameData=(typeof GAMES_DATA!=="undefined" && GAMES_DATA && Array.isArray(GAMES_DATA.games))
  ? GAMES_DATA.games : [];

function kickoffDate(game){
  if(!game.kickoff) return null;
  const d=new Date(game.kickoff);
  return Number.isNaN(d.getTime()) ? null : d;
}
function gameStatus(game){
  if(game.final){
    return {key:"final",label:"Final"};
  }
  const ko=kickoffDate(game);
  if(ko && Date.now() >= ko.getTime()){
    return {key:"live",label:"Underway"};
  }
  return {key:"pre",label:"Pre-game"};
}
function kickoffLabel(game){
  const ko=kickoffDate(game);
  if(ko){
    return new Intl.DateTimeFormat(undefined,{
      weekday:"short",month:"short",day:"numeric",
      hour:"numeric",minute:"2-digit"
    }).format(ko);
  }
  return game.time || "";
}
function finalResult(game){
  if(!game.final) return "";
  if(game.winner==="TIE") return "Tie";
  if(game.winner) return `${game.winner} won`;
  return "Final";
}

const gamesHost=document.getElementById("games");
if(!gameData.length){
  gamesHost.innerHTML='<div class="empty">No games are currently available in games-data.js.</div>';
}else{
  gamesHost.innerHTML=`<div class="game-list">${gameData.map(game=>{
    const st=gameStatus(game);
    const result=finalResult(game);
    return `<div class="game-row">
      <div class="game-main">
        <div class="game-matchup">${game.away} @ ${game.home}</div>
        <div class="game-time">${kickoffLabel(game)}</div>
        ${result ? `<div class="game-result">${result}</div>` : ""}
      </div>
      <div class="status-pill ${st.key}">${st.label}</div>
    </div>`;
  }).join("")}</div>`;
}

const history=Array.isArray(s.history)?s.history:[];
const host=document.getElementById("history");
if(!history.length){
  host.innerHTML='<div class="empty">No updater activity has been logged yet.</div>';
}else{
  host.innerHTML=`<table>
    <thead><tr><th>Time</th><th>Type</th><th>Details</th></tr></thead>
    <tbody>${history.map(item=>`
      <tr>
        <td>${dt(item.time)}</td>
        <td class="type ${item.type||""}">${item.type||""}</td>
        <td>${item.message||""}</td>
      </tr>`).join("")}</tbody>
  </table>`;
}
</script>
</body>
</html>
