name: Update NFL results

on:
  # Wake every five minutes; Python skips ESPN between game windows.
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run NFL updater
        id: updater
        shell: bash
        run: |
          set +e
          python scripts/update_nfl_results.py
          CODE=$?
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show changes
        run: git diff -- games-data.js action-status.js

      - name: Commit updater status and game results
        shell: bash
        run: |
          if git diff --quiet -- games-data.js action-status.js; then
            echo "No tracked updater changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games-data.js action-status.js
          git commit -m "Update NFL game monitor"
          git push

      - name: Mark workflow failed if updater reported an error
        if: steps.updater.outputs.code != '0'
        shell: bash
        run: |
          echo "The updater reported an error. action-status.js was committed with details."
          exit 1
