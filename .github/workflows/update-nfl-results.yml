name: Update NFL results

on:
  # Start in manual-test mode. After we verify it on GitHub, we can add
  # the scheduled trigger without changing the Python updater.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-results
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NFL schedule and update final results
        run: python scripts/update_nfl_results.py

      - name: Show changes
        run: git diff -- games-data.js

      - name: Commit and push if anything changed
        shell: bash
        run: |
          if git diff --quiet -- games-data.js; then
            echo "No games-data.js changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games-data.js
          git commit -m "Update NFL game results"
          git push
