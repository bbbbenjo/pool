<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Pool Simulator</title>

<style>
:root{
  --navy:#0c2038;
  --navy-2:#163553;
  --navy-3:#244967;
  --ink:#162436;
  --muted:#6f7e90;
  --line:#e3e9ef;
  --line-strong:#cfd8e2;
  --paper:#ffffff;
  --page:#eef3f7;
  --soft:#f7f9fb;
  --green:#2f9a5a;
  --green-soft:#eaf6ef;
  --red-soft:#fceeee;
  --gold:#d4a72c;
  --gold-soft:#fff8df;
  --shadow:0 2px 10px rgba(15,32,55,.07);
}
*{box-sizing:border-box}
html{background:var(--page)}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--page);
  color:var(--ink)
}
button{font:inherit}
header{
  position:sticky;top:0;z-index:50;
  background:rgba(12,32,56,.98);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08)
}
.header-inner{
  max-width:1900px;margin:auto;padding:8px 12px;
  display:flex;gap:14px;align-items:center
}
.title-wrap{min-width:0;flex:1}
h1{margin:0;font-size:18px;line-height:1.08;font-weight:850;letter-spacing:-.015em}
.instructions{font-size:11px;opacity:.76;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset{
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:9px 15px;
  background:#fff;color:var(--navy);
  font-weight:850;cursor:pointer;
  font-size:13px;
  box-shadow:0 1px 3px rgba(0,0,0,.12)
}
.reset:hover{background:#f5f7fa}
.view-controls{
  display:flex;
  align-items:center;
  gap:4px;
  padding:3px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  background:rgba(255,255,255,.08)
}
.mode-btn{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  background:transparent;
  color:rgba(255,255,255,.8);
  font-weight:850;
  font-size:13px;
  cursor:pointer
}
.mode-btn.active{
  background:#fff;
  color:var(--navy);
  box-shadow:0 1px 3px rgba(0,0,0,.12)
}
.mode-btn:hover{background:rgba(255,255,255,.14)}
.mode-btn.active:hover{background:#fff}

main{max-width:1900px;margin:0 auto;padding:10px 10px 0}
footer{
  max-width:1900px;margin:12px auto 0;padding:10px 12px 16px;
  font-size:11px;color:#617084;text-align:center
}
.mobile{display:none}
.desktop{display:block}

.desktop-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 260px;
  gap:4px;
  align-items:start
}
.overall-panel{
  position:sticky;
  top:64px;
  align-self:start;
}
.panel{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow)
}
.matrix-shell{
  min-width:0
}
.matrix-scroll-top{
  overflow-x:auto;
  overflow-y:hidden;
  height:16px;
  margin:0 0 4px;
}
.matrix-scroll-top.is-hidden{
  display:none;
}

.matrix-scroll-top-inner{height:1px}
.matrix-wrap{
  overflow-x:auto;
  overflow-y:visible;
  max-width:100%;
}

.matrix{
  border-collapse:separate;
  border-spacing:2px 3px;
  width:max-content;
  min-width:100%;
  background:#f7f9fb
}
.matrix th,.matrix td{
  border:0;
  padding:0;
  text-align:center;
  font-size:11px;
  height:46px
}
.matrix thead th{
  position:sticky;top:0;z-index:8;
  background:#f7f9fb
}
.matrix .player-head,.matrix .player-cell{
  position:sticky;left:0;z-index:10;
  background:#f7f9fb;text-align:left;
  min-width:216px;max-width:216px
}
.matrix thead .player-head{
  z-index:12;
  background:var(--navy-2)!important;
  color:#fff;
  border-radius:13px 13px 0 0;
  overflow:hidden
}
.player-head-inner{
  height:46px;
  box-sizing:border-box;
  padding:0 11px;
  display:flex;
  align-items:center
}
.player-head-title{
  font-size:11px;
  color:#fff;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.05em
}
.player-cell{
  cursor:pointer;
  padding:5px 8px!important;
  border-radius:8px;
  box-shadow:inset -1px 0 0 #d9e1e8
}
.player-name{
  font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-.01em;font-size:14px;min-width:0
}
.week-topline{
  display:grid;
  grid-template-columns:26px minmax(0,1fr) auto;
  gap:7px;
  align-items:center
}
.week-topline .rank-badge,
.week-topline .player-name,
.week-topline .week-score{
  font-size:14px
}
.week-prob{
  display:flex;
  align-items:center;
  margin-top:5px
}
.prob-explainer{
  flex:0 0 auto;
  margin-right:6px;
  font-size:10px;
  font-weight:800;
  color:#607083;
  white-space:nowrap
}
.rank-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:26px;border-radius:999px;
  background:#edf2f6;color:#607083;font-weight:900;font-size:14px
}
.rank-badge.leader{background:var(--navy-2);color:#fff}
.week-score{
  font-weight:950;font-size:14px;min-width:28px;
  color:var(--navy)
}
.prob-wrap{
  display:flex;align-items:center;min-width:0;flex:1;gap:4px
}
.prob-track{
  position:relative;
  height:21px;
  flex:1;
  background:#e4e9e8;
  border-radius:7px;
  overflow:visible;
  min-width:68px
}
.prob-fill{
  position:absolute;left:0;top:0;height:100%;
  background:#07864a;
  border-radius:7px;
  min-width:0
}
.prob-label-in{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  color:#fff;font-size:11px;font-weight:900;line-height:1
}
.prob-label-out{
  position:absolute;top:50%;transform:translateY(-50%);
  color:#062b54;font-size:11px;font-weight:900;white-space:nowrap
}
.pickcell{
  min-width:47px;
  color:#223248;
  background:#fff;
  border-radius:12px;
  overflow:hidden
}
.pickbox{
  height:46px;min-height:46px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.05
}
.pick-team{font-weight:900;font-size:14px}
.pick-conf{font-size:12px;color:#5f6f82;margin-top:2px;font-weight:850}
.pickcell.good{background:#e6f3eb;color:#176b3b}
.pickcell.bad{background:#f8e9e8;color:#9f3030}
.pickcell.good .pick-conf{color:#2d7c50}
.pickcell.bad .pick-conf{color:#a84848}
.pickcell.na{color:#98a4b1;background:#eef2f5;font-weight:700}

.game-head{
  min-width:56px;
  padding:5px 2px!important;
  vertical-align:top;
  border-radius:9px;
  background:#fff!important;
  box-shadow:inset 0 0 0 1px #dbe3ea
}
.game-head.toggle-zone{cursor:pointer}
.game-head.assumed{
  background:#fff!important;
  box-shadow:inset 0 0 0 2px #9aa7b5
}
.game-head.final-game{
  background:#c7d0d8!important;
  box-shadow:inset 0 0 0 1px #96a3af
}
.pickcell.final-col{
  background:#c7d0d8;
  color:#26394a;
  padding:0!important;
  border-radius:0;
  position:relative
}
.pickcell.final-col .pickbox{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-height:0;
  border-radius:12px;
}
.pickcell.good.final-col{
  background:#c7d0d8;
  color:#155f38;
  box-shadow:none
}
.pickcell.good.final-col .pickbox{
  background:#cfead8;
  box-shadow:inset 0 0 0 2px #2f8f57
}
.pickcell.bad.final-col{
  background:#c7d0d8;
  color:#8d2f2f;
  box-shadow:none
}
.pickcell.bad.final-col .pickbox{
  background:#f2cccc;
  box-shadow:inset 0 0 0 2px #c04b4b
}
.pickcell.good.final-col .pick-conf{
  color:#1d6f43
}
.pickcell.bad.final-col .pick-conf{
  color:#963a3a
}
.pickcell.na.final-col{
  background:#c7d0d8;
  color:#52606d;
  box-shadow:inset 0 0 0 2px #9ca7b1;
  border-radius:0
}

/* Finalized game columns: one continuous dark-gray painted column */
.game-head.final-game,
.pickcell.final-col{
  background:#c7d0d8!important;
}
.game-head.final-game{
  box-shadow:
    inset 0 0 0 1px #96a3af,
    0 3px 0 #c7d0d8!important;
}
.pickcell.final-col{
  box-shadow:
    0 -3px 0 #c7d0d8,
    0 3px 0 #c7d0d8!important;
}
.pickcell.good.final-col,
.pickcell.bad.final-col{
  box-shadow:
    0 -3px 0 #c7d0d8,
    0 3px 0 #c7d0d8!important;
}

.gh-time{
  font-size:10px;color:var(--muted);margin-bottom:5px;white-space:nowrap;
  font-weight:850;letter-spacing:.01em
}
.gh-time.final{color:#58687a}
.gh-teams{display:flex;flex-direction:column;gap:3px;justify-content:center;align-items:center}
.team-mini{
  border:1px solid #aeb9c5;
  background:#fff;color:var(--navy-2);
  border-radius:7px;padding:4px 5px;
  font-weight:850;font-size:9px;line-height:1;
  min-width:50px
}
.team-mini.win{
  color:var(--navy-2);
  background:#e5e9ee!important;
  border-color:#c8d0d9;
  box-shadow:none
}
.game-head.assumed .team-mini.win,
.game-head.final-game .team-mini.win,
.game-head .team-mini.final-win{
  color:#fff;
  border-color:transparent;
  background:var(--team-color)!important
}

.selected-row{
  outline:2px solid var(--gold);
  outline-offset:-1px;
}
.selected-row .player-cell{
  background:var(--gold-soft);
  box-shadow:inset 4px 0 0 var(--gold)
}
.selected-row .pickcell{
  box-shadow:none
}

.overall-panel h2{
  margin:0;
  height:46px;
  box-sizing:border-box;
  padding:0 11px;
  display:flex;
  align-items:center;
  background:var(--navy-2);
  color:#fff;
  font-size:11px;
  font-weight:850;
  letter-spacing:.05em;
  text-transform:uppercase
}
.overall-list{display:flex;flex-direction:column}
.overall-row{
  display:grid;grid-template-columns:26px 1fr 42px;gap:6px;align-items:center;
  padding:8px 9px;
  margin:2px 4px;
  border:0;
  border-radius:8px;
  font-size:12px;cursor:pointer;background:#fff
}
.overall-row:last-child{border-bottom:0}
/* SIMPLE VIEW */
body.simple-mode .week-prob,
body.simple-mode .mprob{
  display:none
}
body.simple-mode .matrix{
  border-spacing:2px 1px
}
body.simple-mode .matrix th,
body.simple-mode .matrix td{
  height:32px
}
body.simple-mode .matrix .player-head,
body.simple-mode .matrix .player-cell{
  min-width:216px;
  max-width:216px
}
body.simple-mode .player-head-inner{
  height:36px
}
body.simple-mode .player-cell{
  padding:1px 8px!important
}
body.simple-mode .week-topline{
  min-height:30px
}
body.simple-mode .overall-row{
  height:32px;
  min-height:32px;
  box-sizing:border-box;
  padding:0 9px;
  margin:1px 4px;
  align-items:center
}
body.simple-mode .pickcell{
  overflow:visible
}
body.simple-mode .pickcell.good,
body.simple-mode .pickcell.bad{
  background:#fff
}
body.simple-mode .pickcell.final-col{
  background:#c7d0d8!important;
  overflow:visible
}
body.simple-mode .pickbox{
  position:relative!important;
  inset:auto!important;
  width:calc(100% - 4px)!important;
  height:30px!important;
  min-height:30px!important;
  margin:1px 2px;
  box-sizing:border-box;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:3px;
  line-height:1;
  border:0!important;
  border-radius:6px!important;
  overflow:hidden
}
body.simple-mode .pickcell.good .pickbox{
  background:#e6f3eb
}
body.simple-mode .pickcell.bad .pickbox{
  background:#f8e9e8
}
body.simple-mode .pickcell.good.final-col .pickbox{
  background:#cfead8;
  box-shadow:inset 0 0 0 2px #2f8f57!important
}
body.simple-mode .pickcell.bad.final-col .pickbox{
  background:#f2cccc;
  box-shadow:inset 0 0 0 2px #c04b4b!important
}
body.simple-mode .pick-team,
body.simple-mode .pick-conf{
  display:inline;
  line-height:1
}
body.simple-mode .pick-conf::before{
  content:""
}

.overall-row:hover{background:#fafbfd}
.overall-row.sel{
  background:var(--gold-soft);
  box-shadow:inset 4px 0 0 var(--gold)
}
.rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#edf2f6;color:#607083;font-weight:900;text-align:center;font-size:14px}
.rank.leader{background:var(--navy-2);color:#fff}
.overall-row .nm{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.overall-row .sc{font-weight:900;text-align:right;color:var(--navy);font-size:14px}
.overall-row .rank,
.overall-row .nm,
.overall-row .sc{font-size:14px}

/* HARD TYPOGRAPHY INVARIANT:
   rank, player name, and score must always match within each standings section. */
.week-topline .rank-badge,
.week-topline .player-name,
.week-topline .week-score{
  font-size:14px!important
}
.overall-row .rank,
.overall-row .nm,
.overall-row .sc{
  font-size:14px!important
}

@media(max-width:820px){
  main{padding:6px 4px 0}
  .desktop{display:none}.mobile{display:block}
  .header-inner{padding:7px 7px}
  h1{font-size:15px}
  .instructions{font-size:9px}
  .reset{padding:8px 11px;border-radius:8px;font-size:12px}

  .mobile-grid{
    display:grid;
    grid-template-columns:minmax(0,1.12fr) 156px minmax(0,.86fr);
    gap:2px;
    align-items:start
  }
  .mcol{
    background:#fff;border:1px solid var(--line);
    border-radius:9px;overflow:hidden;min-width:0;
    box-shadow:0 1px 5px rgba(15,32,55,.05)
  }
  .mhead{
    background:var(--navy-2);color:#fff;
    font-size:9px;font-weight:850;text-transform:uppercase;
    letter-spacing:.05em;padding:6px 5px;
    position:static
  }
  .mrow{
    min-height:62px;
    border-bottom:3px solid #f4f7f9;
    padding:7px 5px;
    cursor:pointer;position:relative;background:#fff;
    display:flex;flex-direction:column;justify-content:center
  }
  .mrow:last-child{border-bottom:0}
  body.simple-mode .weekly-col .mrow{
    min-height:42px;
    padding-top:5px;
    padding-bottom:5px
  }
  .mrow.sel{
    background:var(--gold-soft);
    box-shadow:inset 3px 0 0 var(--gold)
  }
  .overall-col .mrow{
    min-height:0;
    height:auto;
    padding:5px 3px 5px 2px;
    display:block
  }
  .overall-col .mline{
    display:grid;
    grid-template-columns:22px minmax(0,1fr) auto;
    column-gap:6px;
    align-items:center
  }
  .mline{display:flex;gap:3px;align-items:center;min-width:0}
  .mrank{
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;color:#5f7084;width:22px;height:22px;flex:0 0 22px;
    background:#edf2f6;border-radius:99px;font-weight:900
  }
  .mrank.leader{background:var(--navy-2);color:#fff}
  .overall-col .mrank,
  .overall-col .mname,
  .mname{
    font-size:11px;font-weight:850;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1
  }
  .mscore{font-size:14px;font-weight:950;flex:0 0 auto;color:var(--navy)}
  /* Typography rule: within each standings section, rank/name/score match exactly. */
  .overall-col .mrank,
  .overall-col .mname,
  .mprob{display:flex;align-items:center;gap:4px;margin:6px 0 0 26px}

  /* HARD TYPOGRAPHY INVARIANT:
     rank, player name, and score must always match within each standings section. */
  .weekly-col .mrank,
  .weekly-col .mname,
  .weekly-col .mscore{
    font-size:11px!important
  }
  .overall-col .mrank,
  .overall-col .mname,
  .overall-col .mscore{
    font-size:11px!important
  }
  .mprob .prob-explainer{
    margin-right:2px;
    font-size:8px;
    font-weight:800;
    color:#607083
  }
  .mprob .prob-track{height:21px;min-width:0;border-radius:7px}
  .mprob .prob-fill{border-radius:7px}
  .mprob .prob-label-in{font-size:11px;right:6px}
  .mprob .prob-label-out{font-size:11px}

  .game-card{
    border-bottom:3px solid #f4f7f9;
    padding:6px 0;height:62px;background:#fff;
    display:grid;
    grid-template-columns:36px 84px 36px;
    column-gap:0;
    align-items:center
  }
  .game-card.slot-gap{box-shadow:inset 0 3px 0 #edf2f6}
  .game-card.toggle-zone{cursor:pointer;touch-action:manipulation}
  .game-card.assumed{
    background:#fafbfd;
    box-shadow:inset 3px 0 0 #aeb9c5
  }
  .game-card.final-game{
    background:#e1e7ed;
    box-shadow:inset 3px 0 0 #8d9aa8
  }
  .pick-stack,
  .matchup-stack{
    display:grid;
    grid-template-rows:21px 21px;
    row-gap:4px;
    align-items:center;
    min-width:0
  }
  .pick-stack{grid-column:1}
  .matchup-stack{grid-column:2}
  .pick-row,
  .team-choice{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0
  }
  .game-time{
    font-size:10px;color:var(--muted);font-weight:900;
    letter-spacing:.01em;line-height:1.05;
    text-align:center;align-self:center
  }
  .game-day{display:block}
  .game-clock{display:block;margin-top:3px;white-space:nowrap;font-size:10px}
  .team-btn{
    border:1px solid #aeb9c5;
    background:#fff;color:var(--navy-2);
    border-radius:7px;padding:4px 4px;
    font-size:12px;font-weight:900;line-height:1;
    min-width:72px;text-align:center
  }
  .team-btn.win{
    color:var(--navy-2);
    background:#e5e9ee!important;
    border-color:#c8d0d9
  }
  .game-card.assumed .team-btn.win,
  .game-card.final-game .team-btn.win,
  .game-card .team-btn.final-win{
    color:#fff;
    border-color:transparent;
    background:var(--team-color)!important
  }
  .pick-mark{
    font-size:11px;font-weight:900;
    border:1px solid var(--gold);color:#7b6114;background:#fff9e5;
    border-radius:7px;padding:3px 5px;white-space:nowrap
  }
  .pick-mark.correct{border-color:#75b18c;color:#176b3b;background:#e6f3eb}
  .pick-mark.wrong{border-color:#d49b9b;color:#9f3030;background:#f8e9e8}
  footer{font-size:9px;padding:8px 6px 12px}
}
@media(max-width:390px){
  .mobile-grid{grid-template-columns:minmax(0,1fr) 156px minmax(0,.8fr)}
  .mname{font-size:8px}
  .mscore{font-size:10px}
  .team-btn{width:72px!important;min-width:72px!important;max-width:72px!important;padding:4px 4px}
}
</style>

</head>
<body>
<header>
  <div class="header-inner">
    <div class="title-wrap">
      <h1><span class="page-title-desktop" id="pageTitleDesktop"></span><span class="page-title-mobile" id="pageTitleMobile"></span></h1>
      <div class="instructions">Click a player. Gray = default favorite; click a matchup to include that result.</div>
    </div>
    <div class="view-controls" role="group" aria-label="View mode">
      <button class="mode-btn active" id="pointsBtn" type="button">Points</button>
      <button class="mode-btn" id="winPctBtn" type="button">Win %</button>
      <button class="mode-btn combo-mode-btn" id="comboBtn" type="button"><span>Combo</span><span class="beta-tag">Beta</span></button>
    </div>
    <button class="reset" id="resetBtn" type="button">Reset</button>
  </div>
</header>

<main>
  <section class="desktop" id="desktopView">
    <div class="desktop-grid">
      <div class="matrix-shell">
        <div class="matrix-scroll-top" id="matrixScrollTop" aria-label="Scroll picks left and right">
          <div class="matrix-scroll-top-inner" id="matrixScrollTopInner"></div>
        </div>
        <div class="panel matrix-wrap" id="matrixWrap"><table class="matrix" id="matrix"></table></div>
      </div>
      <aside class="panel overall-panel">
        <h2>Overall standings</h2>
        <div class="overall-list" id="desktopOverall"></div>
      </aside>
    </div>
  </section>

  <section class="mobile" id="mobileView">
    <div class="mobile-grid">
      <div class="mcol weekly-col"><div class="mhead" id="mobileWeekHeader"><span id="mobileWeekLabel"></span><span id="mobileSortControls"></span></div><div id="mobileWeekly"></div></div>
      <div class="mcol games-col"><div class="mhead">Games</div><div id="mobileGames"></div></div>
      <div class="mcol overall-col"><div class="mhead">Overall</div><div id="mobileOverall"></div></div>
    </div>
  </section>
</main>

<footer>Made by B-B-B-Benny and the Jets, with help from AI. Send suggestions and questions to Ben.</footer>

<script src="picks-data.js"></script>
<script src="games-data.js"></script>
<script>
const DATA = {
  week: PICKS_DATA.week,
  weekLabel: PICKS_DATA.weekLabel,
  players: PICKS_DATA.players,
  games: GAMES_DATA.games,
  colors: GAMES_DATA.colors || {}
};

document.getElementById("pageTitleDesktop").textContent = `${DATA.weekLabel} Football Pool Simulator`;
document.getElementById("pageTitleMobile").textContent = `${DATA.weekLabel} Simulator`;
document.getElementById("mobileWeekLabel").textContent = DATA.weekLabel;

const state = {
  selectedPlayer: null,
  viewMode: "simple",
  winners: {},
  advancedWinners: {},
  simpleWinners: {},
  winPctWinners: {},
  defaults: {},
  advancedAssumed: new Set(),
  winPctAssumed: new Set(),
  assumed: null,
  weeklySort: "points"
};

for (const g of DATA.games) {
  state.defaults[g.id] = g.final ? g.winner : g.favorite;
  state.advancedWinners[g.id] = state.defaults[g.id];
  state.simpleWinners[g.id] = state.defaults[g.id];
  state.winPctWinners[g.id] = g.final ? g.winner : null;
}
state.winners = state.simpleWinners;
state.assumed = state.advancedAssumed;

function pickFor(player, gid){ return player.picks[gid] || null; }
function scorePlayer(player, winners=state.winners){
  let s=0;
  for(const g of DATA.games){
    const p=pickFor(player,g.id);
    if(!p) continue;
    const w=winners[g.id];
    if(w && w!=="TIE" && p.team===w) s+=p.confidence;
  }
  return s;
}
function overallScore(player, weekScore){
  const scores=[...player.history, weekScore];
  const low=Math.min(...scores);
  return scores.reduce((a,b)=>a+b,0)-low;
}
function ranks(items, key){
  const out=[...items].sort((a,b)=>b[key]-a[key] || a.name.localeCompare(b.name));
  let last=null, rank=0;
  out.forEach((x,i)=>{ if(x[key]!==last){rank=i+1;last=x[key];} x.rank=rank; });
  return out;
}
function pct(x){ return (x*100).toFixed(x*100<10?1:0)+"%"; }
function displayTime(t){
  return t.replace(/\s*(AM|PM)$/i,"");
}
function probBar(prob,maxProb){
  const width=maxProb>0 ? Math.max(0,Math.min(100,100*prob/maxProb)) : 0;
  const label=pct(prob);
  const inside=width>=34;
  return `<div class="prob-wrap"><div class="prob-track">
    <div class="prob-fill" style="width:${width}%">
      ${inside?`<span class="prob-label-in">${label}</span>`:""}
    </div>
    ${inside?"":`<span class="prob-label-out" style="left:calc(${width}% + 4px)">${label}</span>`}
  </div></div>`;
}

function calcWinTieProbabilities(){
  const unresolved = DATA.games.filter(g=>!g.final && !state.assumed.has(g.id));
  const forced = {};
  for(const g of DATA.games){
    if(g.final) forced[g.id]=g.winner;
    else if(state.assumed.has(g.id)) forced[g.id]=state.winners[g.id];
  }
  const probs=Object.fromEntries(DATA.players.map(p=>[p.name,0]));
  const R=unresolved.length;
  const combos=1<<R;
  for(let mask=0; mask<combos; mask++){
    const winners={...forced};
    let sp=1;
    for(let j=0;j<R;j++){
      const g=unresolved[j];
      const awayWins=((mask>>j)&1)===1;
      const w=awayWins?g.away:g.home;
      winners[g.id]=w;
      sp*=awayWins?g.pAway:(1-g.pAway);
    }
    let best=-1, leaders=[];
    for(const p of DATA.players){
      const s=scorePlayer(p,winners);
      if(s>best){best=s;leaders=[p.name];}
      else if(s===best){leaders.push(p.name);}
    }
    for(const n of leaders) probs[n]+=sp;
  }
  return probs;
}

function buildModel(){
  const probs = (state.viewMode==="advanced" || state.viewMode==="winpct")
    ? calcWinTieProbabilities()
    : Object.fromEntries(DATA.players.map(p=>[p.name,0]));
  const rows=DATA.players.map(p=>{
    const week=scorePlayer(p);
    return {player:p,name:p.name,week,overall:overallScore(p,week),prob:probs[p.name]||0};
  });
  const weekly=ranks(rows.map(x=>({...x})),"week");
  const overall=ranks(rows.map(x=>({...x})),"overall");
  return {rows,weekly,overall,probs};
}

function selectedInitial(){
  if(!state.selectedPlayer) return "";
  const words=state.selectedPlayer.replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/);
  return (words.find(w=>/[A-Za-z]/.test(w))||"P")[0].toUpperCase();
}

function setAssumedWinner(gid, team){
  const g=DATA.games.find(x=>x.id===gid);
  if(!g || g.final) return;
  state.winners[gid]=team;
  state.assumed.add(gid);
  render();
}
function toggleMatchup(gid){
  const g=DATA.games.find(x=>x.id===gid);
  if(!g || g.final) return;

  if(state.viewMode==="simple"){
    state.winners[gid] = state.winners[gid]===g.away ? g.home : g.away;
    render();
    return;
  }

  if(state.viewMode==="winpct"){
    const favorite=g.favorite;
    const other=favorite===g.away ? g.home : g.away;
    if(!state.assumed.has(gid)){
      state.winners[gid]=favorite;
      state.assumed.add(gid);
    }else if(state.winners[gid]===favorite){
      state.winners[gid]=other;
    }else{
      state.winners[gid]=null;
      state.assumed.delete(gid);
    }
    render();
    return;
  }

  const favorite=state.defaults[gid];
  const other=favorite===g.away ? g.home : g.away;

  // Combo mode four-step cycle:
  // 1) turn probability conditioning on, keep winner
  // 2) keep conditioning on, switch winner
  // 3) turn conditioning off, keep winner
  // 4) keep conditioning off, switch winner
  if(!state.assumed.has(gid) && state.winners[gid]===favorite){
    state.assumed.add(gid);
  }else if(state.assumed.has(gid) && state.winners[gid]===favorite){
    state.winners[gid]=other;
  }else if(state.assumed.has(gid) && state.winners[gid]===other){
    state.assumed.delete(gid);
  }else{
    state.winners[gid]=favorite;
  }
  render();
}
function selectPlayer(name){ state.selectedPlayer = state.selectedPlayer===name ? null : name; render(); }

function teamButton(g, team, cls=""){
  const win=state.winners[g.id]===team;
  const hard=state.viewMode==="simple" || g.final || state.assumed.has(g.id);
  const color=DATA.colors[team]||"#26384d";
  const hardWin=win && hard;
  return `<span class="${cls} ${win?"win":""} ${hardWin?"final-win":""}" style="--team-color:${color}">${team}</span>`;
}

function renderDesktop(model){
  const maxProb=Math.max(...model.rows.map(r=>r.prob),0.000001);
  const sorted = state.viewMode==="winpct"
    ? [...model.rows].sort((a,b)=>b.prob-a.prob || b.week-a.week || a.name.localeCompare(b.name))
    : state.viewMode==="advanced" && state.weeklySort==="prob"
      ? [...model.weekly].sort((a,b)=>b.prob-a.prob || b.week-a.week || a.name.localeCompare(b.name))
      : model.weekly;

  let h=`<thead><tr><th class="player-head"><div class="player-head-inner">
    <div class="player-head-title">${DATA.weekLabel}</div>
    ${state.viewMode==="advanced" ? `<div class="week-sort-block">
      <div class="week-sort-label">Sort by:</div>
      <div class="week-sort-controls" role="group" aria-label="Sort ${DATA.weekLabel} standings">
        <button type="button" class="week-sort-btn ${state.weeklySort==="points"?"active":""}" data-week-sort="points"><span class="sort-label-desktop">Points</span><span class="sort-label-mobile">Pts.</span></button>
        <button type="button" class="week-sort-btn ${state.weeklySort==="prob"?"active":""}" data-week-sort="prob"><span class="sort-label-desktop">Win %</span><span class="sort-label-mobile">%</span></button>
      </div>
    </div>` : ""}
  </div></th>`;

  for(const g of DATA.games){
    const assumed=state.viewMode!=="simple" && state.assumed.has(g.id);
    const favorite=g.favorite;
    const underdog=favorite===g.away ? g.home : g.away;
    h+=`<th class="game-head ${g.final?"final-game":"toggle-zone"} ${assumed?"assumed":""}" data-toggle-game="${g.final?"":g.id}">
      ${g.final
        ? `<div class="gh-time final">FINAL</div>`
        : state.viewMode==="advanced" && assumed
          ? `<div class="gh-assumed-pct">%</div>`
          : (state.viewMode==="simple" || state.viewMode==="winpct")
            ? `<div class="gh-simple-time">${displayTime(g.time)}</div>`
            : ""}
      <div class="gh-teams">${teamButton(g,favorite,"team-mini")}${teamButton(g,underdog,"team-mini")}</div>
    </th>`;
  }

  h+=`</tr></thead><tbody>`;
  for(const r of sorted){
    const sel=r.name===state.selectedPlayer;
    h+=`<tr class="${sel?"selected-row":""}">
      <td class="player-cell" data-player="${r.name.replaceAll('"','&quot;')}">
        ${state.viewMode==="winpct"
          ? `<div class="winpct-desktop-player">
               <span class="player-name">${r.name}</span>
               ${probBar(r.prob,maxProb)}
             </div>`
          : `<div class="week-topline">
               <span class="rank-badge ${r.rank===1?"leader":""}">${r.rank}</span>
               <span class="player-name">${r.name}</span>
               <span class="week-score">${r.week}</span>
             </div>
             ${state.viewMode==="advanced" ? `<div class="week-prob">
               <span class="prob-explainer">Win:</span>
               ${probBar(r.prob,maxProb)}
             </div>` : ""}`
        }
      </td>`;

    for(const g of DATA.games){
      const p=pickFor(r.player,g.id);
      if(!p){
        h+=`<td class="pickcell na ${g.final?"final-col":""}">N/A</td>`;
        continue;
      }
      const w=state.winners[g.id];
      const unresolvedNeutral = state.viewMode==="winpct" && !g.final && !state.assumed.has(g.id);
      const result = unresolvedNeutral ? "pending" : (w==="TIE" ? "na" : (p.team===w?"good":"bad"));
      const compact = state.viewMode==="simple" || state.viewMode==="winpct";
      h+=compact
        ? `<td class="pickcell ${result} ${g.final?"final-col":""}"><div class="pickbox"><span class="pick-team">${p.team}</span><span class="pick-conf">${p.confidence}</span></div></td>`
        : `<td class="pickcell ${result} ${g.final?"final-col":""}"><div class="pickbox"><div class="pick-team">${p.team}</div><div class="pick-conf">${p.confidence}</div></div></td>`;
    }
    h+=`</tr>`;
  }
  h+=`</tbody>`;
  document.getElementById("matrix").innerHTML=h;

  document.getElementById("desktopOverall").innerHTML=model.overall.map(r=>
    `<div class="overall-row ${r.name===state.selectedPlayer?"sel":""}" data-player="${r.name.replaceAll('"','&quot;')}">
      <span class="rank ${r.rank===1?"leader":""}">${r.rank}</span><span class="nm">${r.name}</span><span class="sc">${r.overall}</span>
    </div>`).join("");
}
function renderMobile(model){
  const maxProb=Math.max(...model.rows.map(r=>r.prob),0.000001);
  const mobileWeeklyRows = state.viewMode==="winpct"
    ? [...model.rows].sort((a,b)=>b.prob-a.prob || b.week-a.week || a.name.localeCompare(b.name))
    : state.viewMode==="advanced" && state.weeklySort==="prob"
      ? [...model.weekly].sort((a,b)=>b.prob-a.prob || b.week-a.week || a.name.localeCompare(b.name))
      : model.weekly;

  const mobileSort=document.getElementById("mobileSortControls");
  if(mobileSort){
    mobileSort.innerHTML=state.viewMode==="advanced" ? `<span class="mobile-sort-wrap">
      <span class="week-sort-label mobile-sort-label">Sort by:</span>
      <span class="week-sort-controls mobile-sort-controls" role="group" aria-label="Sort ${DATA.weekLabel} standings">
        <button type="button" class="week-sort-btn ${state.weeklySort==="points"?"active":""}" data-week-sort="points"><span class="sort-label-desktop">Points</span><span class="sort-label-mobile">Pts.</span></button>
        <button type="button" class="week-sort-btn ${state.weeklySort==="prob"?"active":""}" data-week-sort="prob"><span class="sort-label-desktop">Win %</span><span class="sort-label-mobile">%</span></button>
      </span>
    </span>` : "";
  }

  document.getElementById("mobileWeekly").innerHTML=mobileWeeklyRows.map(r=>
    state.viewMode==="winpct"
      ? `<div class="mrow winpct-mrow ${r.name===state.selectedPlayer?"sel":""}" data-player="${r.name.replaceAll('"','&quot;')}">
           <div class="winpct-mobile-name">${r.name}</div>
           <div class="winpct-mobile-prob">${probBar(r.prob,maxProb)}</div>
         </div>`
      : `<div class="mrow ${r.name===state.selectedPlayer?"sel":""}" data-player="${r.name.replaceAll('"','&quot;')}">
           <div class="mline"><span class="mrank ${r.rank===1?"leader":""}">${r.rank}</span><span class="mname">${r.name}</span><span class="mscore">${r.week}</span></div>
           ${state.viewMode==="advanced" ? `<div class="mprob"><span class="prob-explainer">Win:</span>${probBar(r.prob,maxProb)}</div>` : ""}
         </div>`
  ).join("");

  document.getElementById("mobileOverall").innerHTML=model.overall.map(r=>
    `<div class="mrow ${r.name===state.selectedPlayer?"sel":""}" data-player="${r.name.replaceAll('"','&quot;')}">
      <div class="mline"><span class="mrank ${r.rank===1?"leader":""}">${r.rank}</span><span class="mname">${r.name}</span><span class="mscore">${r.overall}</span></div>
    </div>`).join("");

  const sp=state.selectedPlayer ? DATA.players.find(p=>p.name===state.selectedPlayer) : null;
  let prevSlot="";
  document.getElementById("mobileGames").innerHTML=DATA.games.map(g=>{
    const slot=g.time.replace(/\d.*$/,"").trim()+" "+(g.time.includes("9:30")?"AM":g.time.includes("1:00")?"EARLY":g.time.includes("4:")?"LATE":g.time.includes("8:")?"NIGHT":"");
    const gap=prevSlot && slot!==prevSlot; prevSlot=slot;
    const p=sp ? pickFor(sp,g.id) : null;
    const assumed=state.viewMode!=="simple" && state.assumed.has(g.id);
    const favorite=g.favorite;
    const underdog=favorite===g.away ? g.home : g.away;
    const mark=(team)=>{
      if(!p || p.team!==team) return "";
      let cls="";
      if(g.final){
        cls = p.team===state.winners[g.id] ? "correct" : "wrong";
      }
      return `<span class="pick-mark ${cls}">${p.confidence}</span>`;
    };
    return `<div class="game-card ${gap?"slot-gap":""} ${g.final?"final-game":"toggle-zone"} ${assumed?"assumed":""}" data-toggle-game="${g.final?"":g.id}">
      <div class="pick-stack">
        <div class="pick-row">${p && p.team===favorite ? mark(favorite) : ""}</div>
        <div class="pick-row">${p && p.team===underdog ? mark(underdog) : ""}</div>
      </div>
      <div class="matchup-stack">
        <div class="team-choice">${teamButton(g,favorite,"team-btn")}</div>
        <div class="team-choice">${teamButton(g,underdog,"team-btn")}</div>
      </div>
    </div>`;
  }).join("");
}
function attachHandlers(){
  document.querySelectorAll("[data-player]").forEach(el=>el.addEventListener("click",()=>selectPlayer(el.dataset.player)));
  document.querySelectorAll("[data-week-sort]").forEach(el=>el.addEventListener("click",(e)=>{
    e.stopPropagation();
    const isMobileToggle = window.matchMedia("(max-width:820px)").matches;
    if(isMobileToggle){
      state.weeklySort = state.weeklySort==="points" ? "prob" : "points";
    }else{
      state.weeklySort=el.dataset.weekSort;
    }
    render();
  }));
  document.querySelectorAll(".mobile-sort-controls").forEach(el=>el.addEventListener("click",(e)=>{
    if(e.target.closest("[data-week-sort]")) return;
    state.weeklySort = state.weeklySort==="points" ? "prob" : "points";
    render();
  }));
  document.querySelectorAll("[data-toggle-game]").forEach(el=>{
    const gid=el.dataset.toggleGame;
    if(!gid) return;
    el.addEventListener("click",()=>toggleMatchup(gid));
  });
}
function setViewMode(mode){
  if(mode!=="simple" && mode!=="winpct" && mode!=="advanced") return;
  if(mode==="advanced" && state.viewMode!=="advanced"){
    state.weeklySort="points";
  }
  state.viewMode=mode;
  if(mode==="simple"){
    state.winners=state.simpleWinners;
    state.assumed=state.advancedAssumed;
  }else if(mode==="winpct"){
    state.winners=state.winPctWinners;
    state.assumed=state.winPctAssumed;
  }else{
    state.winners=state.advancedWinners;
    state.assumed=state.advancedAssumed;
  }
  render();
}
function updateInteractionWording(){
  const instructions=document.querySelector(".instructions");
  if(!instructions) return;
  const isTouch = window.matchMedia("(any-pointer: coarse)").matches ||
                  window.matchMedia("(hover: none)").matches;
  instructions.textContent = `${isTouch ? "Tap" : "Click"} on any player or game.`;
}

function updateTouchMobileScrolling(){
  const isTouchMobile = window.matchMedia("(max-width:820px) and (any-pointer: coarse)").matches;
  document.body.classList.toggle("touch-independent-scroll", isTouchMobile);
  document.documentElement.classList.toggle("touch-scroll-locked", isTouchMobile);

  const grid=document.querySelector(".mobile-grid");
  if(!grid) return;

  if(isTouchMobile){
    // The three columns are the only vertical scrollers on touch phones.
    // Keep the document itself pinned at the top so their sticky headers
    // can never slide beneath the overall page header.
    if(window.scrollY!==0) window.scrollTo(0,0);
    requestAnimationFrame(()=>{
      const top=grid.getBoundingClientRect().top;
      const viewportHeight=window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const available=Math.max(240, viewportHeight-top-8);
      grid.style.setProperty("--touch-mobile-height", available+"px");
    });
  }else{
    grid.style.removeProperty("--touch-mobile-height");
  }
}

function render(){
  document.body.classList.toggle("simple-mode", state.viewMode==="simple");
  document.body.classList.toggle("winpct-mode", state.viewMode==="winpct");
  document.body.classList.toggle("advanced-mode", state.viewMode==="advanced");

  const pointsBtn=document.getElementById("pointsBtn");
  const winPctBtn=document.getElementById("winPctBtn");
  const comboBtn=document.getElementById("comboBtn");
  pointsBtn.classList.toggle("active", state.viewMode==="simple");
  winPctBtn.classList.toggle("active", state.viewMode==="winpct");
  comboBtn.classList.toggle("active", state.viewMode==="advanced");
  pointsBtn.setAttribute("aria-pressed", state.viewMode==="simple" ? "true" : "false");
  winPctBtn.setAttribute("aria-pressed", state.viewMode==="winpct" ? "true" : "false");
  comboBtn.setAttribute("aria-pressed", state.viewMode==="advanced" ? "true" : "false");

  if(state.viewMode==="simple"){
    document.querySelector(".instructions").textContent =
      "Click a player. Click any non-final game to toggle the winner.";
  }else if(state.viewMode==="winpct"){
    document.querySelector(".instructions").textContent =
      "Click a player. Unselected games remain probabilistic; click a matchup to assume a winner.";
  }else{
    document.querySelector(".instructions").textContent =
      "Click a player. Gray = default favorite; click a matchup to include that result.";
  }
  updateInteractionWording();
  const model=buildModel();
  renderDesktop(model);
  renderMobile(model);
  attachHandlers();
  updateTouchMobileScrolling();

  /* Run the desktop geometry sync only after the freshly-rendered table has
     completed layout. A second frame catches late font/scrollbar settling on
     initial page load. */
  requestAnimationFrame(()=>{
    syncDesktopScrollbars();
    requestAnimationFrame(syncDesktopScrollbars);
  });
}
function syncDesktopScrollbars(){
  const top=document.getElementById("matrixScrollTop");
  const inner=document.getElementById("matrixScrollTopInner");
  const wrap=document.getElementById("matrixWrap");
  const table=document.getElementById("matrix");
  const shell=document.querySelector(".matrix-shell");
  const weekHead=document.querySelector(".player-head-inner");
  const overallHead=document.querySelector(".overall-panel h2");
  if(!top || !inner || !wrap || !table) return;

  const needsScroll=table.scrollWidth > wrap.clientWidth + 2;
  top.classList.toggle("is-hidden", !needsScroll);

  /* Desktop horizontal scrolling is games-only. The weekly column stays
     pinned at the left, and the synchronized top scrollbar begins immediately
     to its right. Matching the reduced scrollbar viewport/content widths keeps
     its scroll range identical to the table's game-scroll range. */
  const playerHead=table.querySelector(".player-head");
  const firstGameHead=table.querySelector(".game-head");
  const shellRect=shell ? shell.getBoundingClientRect() : null;
  const playerRect=playerHead ? playerHead.getBoundingClientRect() : null;
  const gameRect=firstGameHead ? firstGameHead.getBoundingClientRect() : null;

  const pinnedWidth=playerRect ? Math.round(playerRect.width) : 216;
  const pinnedLeft=(shellRect && playerRect) ? Math.round(playerRect.left-shellRect.left) : 0;
  const gamesLeft=(shellRect && gameRect) ? Math.round(gameRect.left-shellRect.left) : pinnedLeft+pinnedWidth;

  if(needsScroll && window.innerWidth>=821){
    /* Align the scrollbar to the ACTUAL first game column, including table
       border-spacing/panel inset, rather than approximating from player width. */
    top.style.marginLeft=gamesLeft+"px";
    top.style.width=`calc(100% - ${gamesLeft}px)`;

    /* Preserve the exact same horizontal scroll range as the matrix. */
    inner.style.width=Math.max(1, table.scrollWidth-gamesLeft)+"px";
  }else{
    top.style.marginLeft="";
    top.style.width="";
    inner.style.width=table.scrollWidth+"px";
  }

  /* When the top scrollbar is present, visually extend the weekly header
     upward into the space to the left of the scrollbar, and make the Overall
     header itself taller by the same offset. The player rows therefore remain
     aligned while the empty gaps around the scrollbar become dark blue. */
  requestAnimationFrame(()=>{
    const overallPanel=document.querySelector(".overall-panel");
    if(shell && weekHead && overallHead && overallPanel && window.innerWidth>=821){
      const shellTop=shell.getBoundingClientRect().top;
      const weekRect=weekHead.getBoundingClientRect();
      const offset=Math.max(0, Math.round(weekRect.top-shellTop));
      const baseHeight=Math.round(weekRect.height);

      shell.style.setProperty("--top-scroll-gap", needsScroll ? offset+"px" : "0px");
      shell.style.setProperty("--pinned-week-left", pinnedLeft+"px");
      shell.style.setProperty("--pinned-week-width", pinnedWidth+"px");
      shell.style.setProperty("--games-left", gamesLeft+"px");
      shell.classList.toggle("has-top-scroll", needsScroll);

      const desktopGrid=document.querySelector(".desktop-grid");
      if(desktopGrid){
        desktopGrid.style.setProperty("--top-scroll-gap", needsScroll ? offset+"px" : "0px");
        desktopGrid.classList.toggle("has-top-scroll", needsScroll);
      }

      overallPanel.style.marginTop="0px";
      if(needsScroll){
        overallHead.style.height=(baseHeight+offset)+"px";
        overallHead.style.minHeight=(baseHeight+offset)+"px";
        overallHead.style.paddingTop=offset+"px";
        overallHead.style.paddingBottom="0px";
        overallHead.style.marginTop="0px";
      }else{
        overallHead.style.removeProperty("height");
        overallHead.style.removeProperty("min-height");
        overallHead.style.removeProperty("padding-top");
        overallHead.style.removeProperty("padding-bottom");
        overallHead.style.removeProperty("margin-top");
      }
    }else{
      if(shell){
        shell.style.removeProperty("--top-scroll-gap");
        shell.style.removeProperty("--pinned-week-left");
        shell.style.removeProperty("--pinned-week-width");
        shell.style.removeProperty("--games-left");
        shell.classList.remove("has-top-scroll");
      }
      const desktopGrid=document.querySelector(".desktop-grid");
      if(desktopGrid){
        desktopGrid.style.removeProperty("--top-scroll-gap");
        desktopGrid.classList.remove("has-top-scroll");
      }
      if(overallPanel) overallPanel.style.marginTop="";
      if(overallHead){
        overallHead.style.removeProperty("height");
        overallHead.style.removeProperty("min-height");
        overallHead.style.removeProperty("padding-top");
        overallHead.style.removeProperty("padding-bottom");
        overallHead.style.removeProperty("margin-top");
      }
    }
  });

  if(!top.dataset.bound){
    let syncing=false;
    top.addEventListener("scroll",()=>{
      if(syncing) return;
      syncing=true; wrap.scrollLeft=top.scrollLeft; syncing=false;
    });
    wrap.addEventListener("scroll",()=>{
      if(syncing) return;
      syncing=true; top.scrollLeft=wrap.scrollLeft; syncing=false;
    });
    window.addEventListener("resize",()=>requestAnimationFrame(syncDesktopScrollbars));
    top.dataset.bound="1";
  }
  if(needsScroll) top.scrollLeft=wrap.scrollLeft;
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>requestAnimationFrame(syncDesktopScrollbars));
}
window.addEventListener("load",()=>{
  requestAnimationFrame(()=>requestAnimationFrame(syncDesktopScrollbars));
  requestAnimationFrame(updateTouchMobileScrolling);
});
window.addEventListener("resize",()=>{
  requestAnimationFrame(updateTouchMobileScrolling);
  requestAnimationFrame(updateInteractionWording);
});
window.addEventListener("orientationchange",()=>{
  requestAnimationFrame(updateTouchMobileScrolling);
  requestAnimationFrame(updateInteractionWording);
});

document.getElementById("pointsBtn").addEventListener("click",()=>setViewMode("simple"));
document.getElementById("winPctBtn").addEventListener("click",()=>setViewMode("winpct"));
document.getElementById("comboBtn").addEventListener("click",()=>setViewMode("advanced"));

document.getElementById("resetBtn").addEventListener("click",()=>{
  state.advancedAssumed.clear();
  state.winPctAssumed.clear();
  state.weeklySort="points";
  for(const g of DATA.games){
    state.advancedWinners[g.id]=state.defaults[g.id];
    state.simpleWinners[g.id]=state.defaults[g.id];
    state.winPctWinners[g.id]=g.final ? g.winner : null;
  }
  if(state.viewMode==="simple"){
    state.winners=state.simpleWinners;
    state.assumed=state.advancedAssumed;
  }else if(state.viewMode==="winpct"){
    state.winners=state.winPctWinners;
    state.assumed=state.winPctAssumed;
  }else{
    state.winners=state.advancedWinners;
    state.assumed=state.advancedAssumed;
  }
  render();

  /* Reset the independently scrolling mobile columns to their tops as well. */
  requestAnimationFrame(()=>{
    document.querySelectorAll(".mobile-grid > .mcol").forEach(col=>{
      col.scrollTop=0;
    });
  });
});
render();
</script>
